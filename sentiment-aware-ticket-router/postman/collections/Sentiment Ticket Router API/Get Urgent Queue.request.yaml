$kind: http-request
url: "{{baseUrl}}/tickets/urgent"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 OK", function () {
          pm.response.to.have.status(200);
      });

      var response = pm.response.json();
      pm.test("Urgent queue contains items", function () {
          pm.expect(response.urgent_count).to.be.above(0);
          pm.expect(response.tickets).to.be.an("array");
      });
    language: text/javascript
order: 3656375691920825
